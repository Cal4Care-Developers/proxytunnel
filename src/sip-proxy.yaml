# RingQ SIP Proxy Configuration
# NX Device LAN IP : 192.168.10.130
# Office Public IP  : 43.225.164.198
# Cloud PBX Domain  : sgringq102.ringq.ai
# Cloud PBX IP      : 103.102.235.105


admin:
  addr: "192.168.10.130:8899"

proxies:
  - name: "RingQ-Proxy"

    pbx-domain: "ringqsg80.ringq.ai"
    pbx-api-url: "https://ringqsg80.ringq.ai:8443"

    # Auth Key from RingQ portal ? Settings ? Tunnel Connections
    # PBX validates: WHERE domain = pbx-domain AND auth_key = auth-key
    auth-key: "R1_2T8cPhks1bvuOLY1q83L7IPZUplDBE5L7ckqOKH1hkjn5elUlhwNfZV4_5nS4gmT8ksIwyNedM-zVIG9TZw"

    # Device ID auto-detected from /etc/machine-id at startup when empty.
    # Leave blank; the proxy fills it in. Set explicitly only to override.
    device-id: ""

    dialog-timeout: 1200
    no-received: false
    must-record-route: true
    keep-next-hop-route: "no"

    listens:
      - address: "192.168.10.130"
        udp-port: 5060          # LAN phones register and call over UDP/5060
        tcp-port: 5061
        via: "udp://43.225.164.198:5060"
        backends:
          # NX Device ? PBX uses TCP on dedicated port 6010
          - address: "tcp://ringqsg80.ringq.ai:6010" 	#6010

    route:
      - dests:
          - "ringqsg80.ringq.ai"
        protocol: tcp
        nexthop: "ringqsg80.ringq.ai:6010"		#6010
      - dests:
          - "default"
        protocol: tcp
        nexthop: "ringqsg80.ringq.ai:6010"		#6010

    hosts:
      - name: "ringqsg80.ringq.ai"
        ip:   "ringqsg80.ringq.ai"
      - name: "192.168.10.130,43.225.164.198"
        ip:   "192.168.10.130"

hosts:
  - name: "ringqsg80.ringq.ai"
    ip:   "ringqsg80.ringq.ai"
  - name: "192.168.10.130,43.225.164.198"
    ip:   "192.168.10.130"